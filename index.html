<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Service Unavailable</title>

    <style>
        body {
            margin: 0;
            padding: 40px;
            background: #ffffff;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }

        .error {
            max-width: 700px;
            margin: 60px auto;
        }

        h1 {
            margin: 0 0 15px;
            font-size: 28px;
            font-weight: 600;
            color: #333333;
        }

        p {
            margin: 8px 0;
            color: #555555;
        }

        .details {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #eeeeee;
            color: #777777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="error">

        <h1>Service Unavailable</h1>

        <p>
            The server is temporarily unable to service your request
            due to maintenance downtime or capacity problems.
        </p>

        <p>
            Please try again later.
        </p>

        <div class="details">
            Error 503 — Service Unavailable
        </div>

    </div>

</body>
</html>
