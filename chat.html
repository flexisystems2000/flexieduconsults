<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexi Direct Chats</title>
    <style>
        :root { --blue: #003366; --green: #2E8B57; --bg: #f4f7f6; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding-bottom: 70px; }
        header { height: 60px; background: var(--blue); border-bottom: 4px solid var(--green); display: flex; align-items: center; padding: 0 18px; color: #fff; font-weight: 700; }
        .container { width: min(700px, 94%); margin: 18px auto; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 18px; }
        .tab-btn { flex: 1; border: none; cursor: pointer; border-radius: 10px; background: #ececec; color: #666; padding: 11px; font-weight: 700; text-align: center; text-decoration: none; }
        .tab-btn.active { background: var(--blue); color: #fff; }
        
        .user-list { background: #fff; border-radius: 15px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,.05); }
        .item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #e8e8e8; cursor: pointer; }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 44px; height: 44px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        
        /* DARK ROYAL BLUE BADGE 🔵 */
        .badge { background: var(--blue); color: #fff; font-size: 0.75rem; font-weight: 700; min-width: 22px; height: 22px; border-radius: 50px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
    </style>
</head>
<body>

    <header><span>Flexi Direct Messages</span></header>

    <div class="container">
        <div class="nav-tabs">
            <a href="groups.html" class="tab-btn">GROUPS</a>
            <a href="chat.html" class="tab-btn active">CHATS</a>
        </div>

        <div id="user-list-container" class="user-list">
            <div style="padding: 20px; text-align: center; color: #888;">Loading users...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM", authDomain: "flexieduconsult.com.ng", projectId: "waec2026jamb2027" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "login.html"; return; }
            loadUsers();
        });

        function loadUsers() {
            onSnapshot(collection(db, "profiles"), (snapshot) => {
                const container = document.getElementById("user-list-container");
                container.innerHTML = "";
                snapshot.forEach((uDoc) => {
                    if (uDoc.id === auth.currentUser.uid) return;
                    const u = uDoc.data();
                    const unread = u.unreadCount || 0;

                    container.innerHTML += `
                        <div class="item" onclick="openChat('${uDoc.id}', '${u.name}')">
                            <div class="item-left">
                                <div class="avatar">👤</div>
                                <div>
                                    <strong style="color:#003366">${u.name}</strong>
                                    <div style="font-size:0.75rem; color:#888;">Tap to open chat</div>
                                </div>
                            </div>
                            ${unread > 0 ? `<div class="badge">${unread}</div>` : ''}
                        </div>
                    `;
                });
            });
        }

        window.openChat = (otherUid, otherName) => {
            const chatId = [auth.currentUser.uid, otherUid].sort().join('_');
            window.location.href = `chat_enter.html?chatId=${chatId}&otherUid=${otherUid}&name=${encodeURIComponent(otherName)}`;
        };
    </script>
</body>
</html>
