<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexi Direct Chats</title>

    <style>
        :root {
            --blue: #003366;
            --green: #2E8B57;
            --bg: #f4f7f6;
            --text: #222;
            --muted: #888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding-bottom: 70px;
        }

        header {
            height: 60px;
            background: var(--blue);
            border-bottom: 4px solid var(--green);
            display: flex;
            align-items: center;
            padding: 0 18px;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
        }

        .container {
            width: min(700px, 94%);
            margin: 18px auto;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .tab-btn {
            flex: 1;
            border: none;
            cursor: pointer;
            border-radius: 10px;
            background: #ececec;
            color: #666;
            padding: 11px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: .2s;
        }

        .tab-btn.active {
            background: var(--blue);
            color: #fff;
        }

        .user-list {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,.05);
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #e8e8e8;
            cursor: pointer;
            transition: background .2s;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item:hover {
            background: #f7f9fa;
        }

        .item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .avatar {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            overflow: hidden;
            flex-shrink: 0;
            color: #666;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .user-details {
            min-width: 0;
        }

        .user-name {
            color: var(--blue);
            font-weight: 700;
            display: block;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
        }

        .user-status {
            font-size: .75rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .badge {
            background: var(--blue);
            color: #fff;
            font-size: .75rem;
            font-weight: 700;
            min-width: 22px;
            height: 22px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .message {
            padding: 20px;
            text-align: center;
            color: var(--muted);
        }

        .error {
            color: #b00020;
        }
    </style>
</head>

<body>

<header>
    <span>Flexi Direct Messages</span>
</header>

<div class="container">

    <div class="nav-tabs">
        <a href="groups.html" class="tab-btn">GROUPS</a>
        <a href="chat.html" class="tab-btn active">CHATS</a>
    </div>

    <div id="user-list-container" class="user-list">
        <div class="message">Loading users...</div>
    </div>

</div>


<script type="module">

    /* =========================================================
       FIREBASE
    ========================================================= */

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
        getFirestore,
        collection,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    import {
        getAuth,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";


    const firebaseConfig = {
        apiKey: "AIzaSyA0bM6pk1T1peGSS7quvFPEMOMuplnNRNM",
        authDomain: "flexieduconsult.com.ng",
        projectId: "waec2026jamb2027"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);


    /* =========================================================
       HTML ESCAPE
    ========================================================= */

    function escapeHTML(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value).replace(/[&<>'"]/g, function(tag) {

            const chars = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;"
            };

            return chars[tag] || tag;
        });
    }


    /* =========================================================
       GET VALUE FROM MULTIPLE POSSIBLE FIELD NAMES
       
       This is the important fix.
       
       Different users may have been saved with:
       
       displayName
       name
       userName
       username
       fullName
       full_name
       
       Instead of depending only on "name", we check all of them.
    ========================================================= */

    function getDisplayName(profile, firebaseUser = null) {

        const possibleNames = [

            profile?.displayName,
            profile?.name,
            profile?.userName,
            profile?.username,
            profile?.fullName,
            profile?.full_name,
            profile?.display_name,

            firebaseUser?.displayName

        ];


        for (const value of possibleNames) {

            if (
                typeof value === "string" &&
                value.trim() !== ""
            ) {
                return value.trim();
            }
        }


        /*
         * Last fallback:
         * Use the part before @ in the email.
         */

        if (
            firebaseUser?.email &&
            typeof firebaseUser.email === "string"
        ) {

            const emailName = firebaseUser.email
                .split("@")[0]
                .trim();

            if (emailName) {
                return emailName;
            }
        }


        /*
         * If absolutely nothing exists.
         */

        return "User";
    }


    /* =========================================================
       GET PROFILE IMAGE
       
       Supports multiple field names.
    ========================================================= */

    function getProfilePhoto(profile, firebaseUser = null) {

        const possiblePhotos = [

            profile?.photoURL,
            profile?.photoUrl,
            profile?.avatarUrl,
            profile?.avatarURL,
            profile?.profileImage,
            profile?.profileImageUrl,
            profile?.profilePhoto,
            profile?.profilePhotoUrl,
            profile?.image,
            profile?.imageUrl,
            profile?.picture,
            profile?.photo,

            firebaseUser?.photoURL

        ];


        for (const value of possiblePhotos) {

            if (
                typeof value === "string" &&
                value.trim() !== ""
            ) {

                return value.trim();
            }
        }


        return "";
    }


    /* =========================================================
       GET UNREAD COUNT
       
       Handles numbers saved in different formats.
    ========================================================= */

    function getUnreadCount(profile) {

        const possibleValues = [
            profile?.unreadCount,
            profile?.unread,
            profile?.unreadMessages
        ];


        for (const value of possibleValues) {

            const number = Number(value);

            if (
                Number.isFinite(number) &&
                number > 0
            ) {
                return Math.floor(number);
            }
        }


        return 0;
    }


    /* =========================================================
       AVATAR
    ========================================================= */

    function createAvatar(photo, name) {

        if (!photo) {
            return "👤";
        }


        const safePhoto = escapeHTML(photo);
        const safeName = escapeHTML(name);


        return `
            <img
                src="${safePhoto}"
                alt="${safeName}"
                loading="lazy"
                referrerpolicy="no-referrer"
                onerror="this.onerror=null; this.parentNode.innerHTML='👤';"
            >
        `;
    }


    /* =========================================================
       AUTH STATE
    ========================================================= */

    onAuthStateChanged(auth, (user) => {

        if (!user) {

            window.location.href = "login.html";
            return;
        }


        loadUsers(user);
    });


    /* =========================================================
       LOAD USERS
    ========================================================= */

    function loadUsers(currentUser) {

        const container =
            document.getElementById("user-list-container");


        onSnapshot(

            collection(db, "profiles"),

            (snapshot) => {

                container.innerHTML = "";


                if (snapshot.empty) {

                    container.innerHTML = `
                        <div class="message">
                            No users found.
                        </div>
                    `;

                    return;
                }


                let usersFound = 0;


                snapshot.forEach((uDoc) => {

                    /*
                     * Never display the currently logged-in user.
                     */

                    if (uDoc.id === currentUser.uid) {
                        return;
                    }


                    const profile = uDoc.data() || {};


                    /*
                     * Get the user's Auth record only when
                     * the profile already contains enough information.
                     *
                     * Firestore profiles remain the primary source.
                     */

                    const name =
                        getDisplayName(profile);


                    const photo =
                        getProfilePhoto(profile);


                    const unread =
                        getUnreadCount(profile);


                    const safeName =
                        escapeHTML(name);


                    const safeDocId =
                        escapeHTML(uDoc.id);


                    const avatarHTML =
                        createAvatar(photo, name);


                    const unreadHTML =
                        unread > 0
                            ? `<div class="badge">${unread > 99 ? "99+" : unread}</div>`
                            : "";


                    /*
                     * IMPORTANT:
                     *
                     * We encode the name before placing it
                     * into the URL.
                     *
                     * The UID is also encoded.
                     */

                    const item = document.createElement("div");

                    item.className = "item";

                    item.dataset.uid = uDoc.id;


                    item.innerHTML = `

                        <div class="item-left">

                            <div class="avatar">
                                ${avatarHTML}
                            </div>

                            <div class="user-details">

                                <strong class="user-name">
                                    ${safeName}
                                </strong>

                                <div class="user-status">
                                    Tap to open chat
                                </div>

                            </div>

                        </div>

                        ${unreadHTML}

                    `;


                    /*
                     * Use addEventListener instead of putting
                     * the user's name directly inside onclick="..."
                     *
                     * This prevents names containing quotes from
                     * breaking the HTML/JavaScript.
                     */

                    item.addEventListener("click", () => {

                        openChat(
                            uDoc.id,
                            name
                        );

                    });


                    container.appendChild(item);

                    usersFound++;
                });


                if (usersFound === 0) {

                    container.innerHTML = `
                        <div class="message">
                            No other users found.
                        </div>
                    `;
                }
            },


            (error) => {

                console.error(
                    "Error loading profiles:",
                    error
                );


                container.innerHTML = `
                    <div class="message error">
                        Unable to load users.<br>
                        Please refresh the page.
                    </div>
                `;
            }
        );
    }


    /* =========================================================
       OPEN CHAT
    ========================================================= */

    function openChat(otherUid, otherName) {

        if (!auth.currentUser) {
            return;
        }


        /*
         * Sorting the UIDs ensures that:
         *
         * USER A -> USER B
         *
         * and
         *
         * USER B -> USER A
         *
         * always generate the SAME chat ID.
         */

        const chatId = [
            auth.currentUser.uid,
            otherUid
        ]
        .sort()
        .join("_");


        const params = new URLSearchParams({

            chatId: chatId,

            otherUid: otherUid,

            name: otherName

        });


        window.location.href =
            `chat_enter.html?${params.toString()}`;
    }

</script>

</body>
</html>
